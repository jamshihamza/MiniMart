<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<style>doc-page:not(:defined){visibility:hidden}</style>
<script src="./doc-page.js"></script>
</helmet>
<doc-page width="1366px" height="840px">
  <sc-for list="{{ screens }}" as="s" hint-placeholder-count="60">
    <section class="page" style="display:flex;flex-direction:column;font-family:'IBM Plex Sans',system-ui,sans-serif">
      <div style="height:60px;box-sizing:border-box;flex:none;display:flex;align-items:center;gap:12px;padding:0 4px 10px;border-bottom:1px solid #dde1e7">
        <span style="font:700 13px 'IBM Plex Mono',monospace;padding:4px 9px;border-radius:6px;background:#0e1b33;color:#fff">{{ s.n }}</span>
        <span style="font-size:16px;font-weight:700;color:#0f1a2b">{{ s.t }}</span>
        <span style="margin-left:auto;font-size:11px;color:#8c98ad">MiniMart Back Office — Inventory</span>
      </div>
      <div style="width:1366px;height:780px;flex:none;overflow:hidden">
        <dc-import name="MiniMartInventory" screen="{{ s.n }}" embedded="{{ true }}" hint-size="1366px,780px" style="width:1366px;height:780px"></dc-import>
      </div>
    </section>
  </sc-for>
</doc-page>

</x-dc>
<script type="text/x-dc" data-dc-script>
const S=[
['01','Inventory Summary'],['02','Inventory — populated list'],['03','Inventory — filtered Low Stock'],['04','Inventory — Zero Stock'],['05','Inventory — Store Node unavailable'],['06','Inventory — Cloud Sync unavailable'],['07','Inventory — read-only / permission-limited'],
['08','Item Detail — Overview'],['09','Item Detail — Movement History'],['10','Movement Detail Drawer'],['11','Item Detail — Batch / Expiry'],['12','Batch Detail'],['13','Near Expiry list'],['14','Expired Stock list'],['15','Moving WAC — authorized view'],['16','Movement History — store-wide'],
['17','Adjustment History'],['18','New Adjustment'],['19','Adjustment — batch tracked'],['20','Adjustment — validation'],['21','Negative Stock Blocked'],['22','Adjustment — approval required'],['23','Adjustment — review'],['24','Adjustment — posted'],['25','Adjustment — correction / compensating'],['26','Adjustment — safe retry / uncertain'],
['27','Opening Stock — entry'],['28','Opening Stock — review'],['29','Opening Stock — posted'],
['30','Stock Counts — master list'],['31','Create Stock Count'],['32','Count Scope'],['33','Count Entry — standard'],['34','Count Entry — blind'],['35','Count Entry — barcode/search'],['36','Batch Count'],['37','Count Review'],['38','Variance Review'],['39','Recount Requested'],['40','Recount Completed'],['41','Count Approval Required'],['42','Count Ready to Post'],['43','Count Posted'],['44','Zero Variance Count'],['45','Cancel Count'],['46','Posted Count — read-only'],['47','Count Audit / Timeline'],['48','Count Concurrency — authority-dependent'],
['49','Inventory list — 1280×720'],['50','Count entry — 1280×720'],['51','Adjustment — 1280×720'],['52','Inventory DataTable components'],['53','Quantity / Stock status components'],['54','Movement components'],['55','Batch / Expiry components'],['56','Adjustment components'],['57','Count components'],['58','Permission / Approval components'],['59','Offline / Error states'],['60','Component inventory + documentation']];
class Component extends DCLogic {
  componentDidMount(){ [0,300,1000,2500,5000,8000].forEach(ms=>setTimeout(()=>{const dp=document.querySelector('doc-page');if(dp&&dp._measure)dp._measure();},ms)); }
  renderVals(){ return {screens:S.map(([n,t])=>({n,t}))}; }
}

</script>
</body>
</html>
