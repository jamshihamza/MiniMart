components:
  securitySchemes:
    deviceMtls:
      type: mutualTLS
      description: Enrolled device/counter transport identity.
    sessionBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-store-session
    supportBearer:
      type: http
      scheme: bearer
      bearerFormat: scoped-support-session
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 200
    IdempotencyKey:
      name: X-MiniMart-Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"v[0-9]+"$
    ClientVersion:
      name: X-MiniMart-Client-Version
      in: header
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    SearchQ:
      name: q
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
    StatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
    FromDate:
      name: fromDate
      in: query
      required: false
      schema: &id001
        type: string
        format: date
    ToDate:
      name: toDate
      in: query
      required: false
      schema: *id001
    ItemIdFilter:
      name: itemId
      in: query
      required: false
      schema: &id002
        type: string
        format: uuid
        description: UUIDv7-compatible identity.
    CustomerIdFilter:
      name: customerId
      in: query
      required: false
      schema: *id002
    SupplierIdFilter:
      name: supplierId
      in: query
      required: false
      schema: *id002
    ActorIdFilter:
      name: actorUserId
      in: query
      required: false
      schema: *id002
    ReasonFilter:
      name: reasonCode
      in: query
      required: false
      schema:
        type: string
    DocumentNumberFilter:
      name: documentNumber
      in: query
      required: false
      schema:
        type: string
        maxLength: 100
    CodeFilter:
      name: code
      in: query
      required: false
      description: Exact/prefix code filter according to operation semantics.
      schema:
        type: string
        maxLength: 200
    BarcodeFilter:
      name: barcode
      in: query
      required: false
      description: Exact normalized barcode filter.
      schema:
        type: string
        maxLength: 200
    DescriptionFilter:
      name: description
      in: query
      required: false
      description: Case-insensitive normalized description search.
      schema:
        type: string
        maxLength: 200
    RegistrationTaxIdFilter:
      name: registrationTaxId
      in: query
      required: false
      description: Exact normalized registration/tax identifier.
      schema:
        type: string
        maxLength: 200
    AuditSubjectType:
      name: subjectType
      in: query
      required: false
      description: Audit subject/resource type.
      schema:
        type: string
        maxLength: 200
    AuditSubjectId:
      name: subjectId
      in: query
      required: false
      description: Audit subject/resource identifier.
      schema:
        type: string
        maxLength: 200
    AuditAction:
      name: action
      in: query
      required: false
      description: Audit action classification.
      schema:
        type: string
        maxLength: 200
    AuditEventType:
      name: eventType
      in: query
      required: false
      description: Audit event classification.
      schema:
        type: string
        maxLength: 200
    StoreIdFilter:
      name: storeId
      in: query
      required: false
      description: Store UUID filter.
      schema:
        type: string
        format: uuid
  schemas:
    Uuid: *id002
    Decimal:
      type: string
      pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
      description: Exact decimal encoded as JSON string.
    Money:
      type: object
      additionalProperties: false
      required:
      - amount
      - currency
      properties:
        amount:
          $ref: '#/components/schemas/Decimal'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
    Quantity:
      type: object
      additionalProperties: false
      required:
      - value
      properties:
        value:
          $ref: '#/components/schemas/Decimal'
        uomId:
          anyOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
    ResourceRef:
      type: object
      additionalProperties: false
      required:
      - type
      - id
      properties:
        type:
          type: string
          minLength: 1
        id:
          $ref: '#/components/schemas/Uuid'
        documentNumber:
          anyOf:
          - type: string
          - type: 'null'
        version:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
    BusinessContextSnapshot:
      type: object
      additionalProperties: false
      required:
      - tenantId
      - companyId
      - storeId
      - counterId
      - userId
      - businessDate
      - countryRuleSetVersion
      - correlationId
      properties:
        tenantId:
          $ref: '#/components/schemas/Uuid'
        companyId:
          $ref: '#/components/schemas/Uuid'
        storeId:
          $ref: '#/components/schemas/Uuid'
        counterId:
          $ref: '#/components/schemas/Uuid'
        userId:
          $ref: '#/components/schemas/Uuid'
        businessDate: *id001
        countryRuleSetVersion:
          type: string
          minLength: 1
        correlationId:
          type: string
          minLength: 1
        causationId:
          anyOf:
          - type: string
          - type: 'null'
    PageInfo:
      type: object
      additionalProperties: false
      required:
      - hasMore
      - limit
      properties:
        nextCursor:
          anyOf:
          - type: string
          - type: 'null'
        hasMore:
          type: boolean
        limit:
          type: integer
          minimum: 1
          maximum: 200
    ResourceSummary:
      type: object
      additionalProperties: false
      required:
      - type
      - id
      properties:
        type:
          type: string
        id:
          $ref: '#/components/schemas/Uuid'
        version:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        status:
          anyOf:
          - type: string
          - type: 'null'
        code:
          anyOf:
          - type: string
          - type: 'null'
        name:
          anyOf:
          - type: string
          - type: 'null'
        documentNumber:
          anyOf:
          - type: string
          - type: 'null'
        occurredAt:
          anyOf:
          - &id003
            type: string
            format: date-time
          - type: 'null'
        businessDate:
          anyOf:
          - *id001
          - type: 'null'
        amount:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
    PagedResult:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ResourceSummary'
        page:
          $ref: '#/components/schemas/PageInfo'
    ProblemCode:
      type: string
      enum:
      - AUTHENTICATION_REQUIRED
      - BUSINESS_DAY_STATE_CHANGED
      - BUSINESS_RULE_REJECTED
      - CREDIT_CHANGED
      - CREDIT_POLICY_REJECTED
      - DEVICE_NOT_TRUSTED
      - DEVICE_REVOKED
      - IDEMPOTENCY_KEY_REUSED_WITH_DIFFERENT_REQUEST
      - IMPORT_CANCEL_NOT_SAFE
      - IMPORT_VALIDATION_FAILED
      - INCOMPATIBLE_CLIENT
      - INSUFFICIENT_STOCK
      - INVALID_REQUEST
      - OVERRIDE_REQUIRED
      - PAYMENT_ALREADY_COMMITTED
      - PAYMENT_RECOVERY_REQUIRED
      - PAYMENT_UNCERTAIN
      - PERMISSION_DENIED
      - POSTED_DOCUMENT_IMMUTABLE
      - PRECONDITION_FAILED
      - REASON_REQUIRED
      - REFUND_OBLIGATION_OUTSTANDING
      - REFUND_UNCERTAIN
      - RESOURCE_NOT_FOUND
      - RETURN_ELIGIBILITY_CHANGED
      - SERVICE_UNAVAILABLE
      - SESSION_EXPIRED
      - SESSION_LOCKED
      - SHIFT_REQUIRED
      - SHIFT_STATE_CHANGED
      - STALE_RESOURCE_VERSION
      - STOCK_CHANGED
      - SYNC_MESSAGE_INCOMPATIBLE
      - SYNC_OWNERSHIP_VIOLATION
      - UNSUPPORTED_POLICY
      - UPGRADE_REQUIRED
      - VALIDATION_FAILED
    FieldError:
      type: object
      additionalProperties: false
      required:
      - field
      - code
      properties:
        field:
          type: string
        code:
          type: string
        messageKey:
          type: string
        detail:
          anyOf:
          - type: string
          - type: 'null'
    RecoveryHint:
      type: object
      additionalProperties: false
      required:
      - action
      properties:
        action:
          type: string
          enum:
          - RETRY_SAME_IDEMPOTENCY_KEY
          - REFRESH_RESOURCE
          - REAUTHENTICATE
          - REQUEST_OVERRIDE
          - OPEN_RECOVERY_RESOURCE
          - UPGRADE_CLIENT
          - CONTACT_SUPPORT
          - NONE
        resource:
          anyOf:
          - $ref: '#/components/schemas/ResourceRef'
          - type: 'null'
        retryAfterSeconds:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - category
      - correlationId
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          anyOf:
          - type: string
          - type: 'null'
        code:
          $ref: '#/components/schemas/ProblemCode'
        category:
          type: string
          enum:
          - VALIDATION
          - AUTHENTICATION
          - AUTHORIZATION
          - NOT_FOUND
          - CONFLICT
          - CONCURRENCY
          - IDEMPOTENCY
          - BUSINESS_RULE
          - UNCERTAIN_EXTERNAL_OUTCOME
          - INFRASTRUCTURE
          - INCOMPATIBLE_CLIENT
          - UNSUPPORTED_POLICY
        correlationId:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        recovery:
          anyOf:
          - $ref: '#/components/schemas/RecoveryHint'
          - type: 'null'
    CommandReceipt:
      type: object
      additionalProperties: false
      required:
      - commandId
      - outcome
      - correlationId
      - replayed
      properties:
        commandId:
          $ref: '#/components/schemas/Uuid'
        outcome:
          type: string
          enum:
          - COMPLETED
          - ACCEPTED
          - UNCERTAIN
          - NO_EFFECT
        resource:
          anyOf:
          - $ref: '#/components/schemas/ResourceRef'
          - type: 'null'
        correlationId:
          type: string
        replayed:
          type: boolean
        businessContext:
          anyOf:
          - $ref: '#/components/schemas/BusinessContextSnapshot'
          - type: 'null'
    PostingResult:
      type: object
      additionalProperties: false
      required:
      - commandId
      - outcome
      - correlationId
      - replayed
      - postingEnvelopeId
      - document
      properties:
        commandId:
          $ref: '#/components/schemas/Uuid'
        outcome:
          type: string
          enum:
          - COMPLETED
          - NO_EFFECT
        correlationId:
          type: string
        replayed:
          type: boolean
        businessContext:
          anyOf:
          - $ref: '#/components/schemas/BusinessContextSnapshot'
          - type: 'null'
        postingEnvelopeId:
          $ref: '#/components/schemas/Uuid'
        document:
          $ref: '#/components/schemas/ResourceRef'
    EmptyCommand:
      type: object
      additionalProperties: false
      properties: {}
    ReasonCommand:
      type: object
      additionalProperties: false
      required:
      - reasonCode
      properties:
        reasonCode:
          type: string
          minLength: 1
        note:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
        overrideId:
          anyOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
    ReasonOptionalCommand:
      type: object
      additionalProperties: false
      properties:
        reasonCode:
          anyOf:
          - type: string
          - type: 'null'
        note:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
        overrideId:
          anyOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
    ReversalRequest:
      type: object
      additionalProperties: false
      required:
      - reasonCode
      properties:
        reasonCode:
          type: string
        note:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
        overrideId:
          anyOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        expectedVersion:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
    PolicyActionRequest:
      type: object
      additionalProperties: false
      required:
      - actionCode
      properties:
        actionCode:
          type: string
        reasonCode:
          anyOf:
          - type: string
          - type: 'null'
        overrideId:
          anyOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
    PostDocumentRequest:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        overrideIds:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
    HealthResult:
      type: object
      additionalProperties: false
      required:
      - status
      - time
      properties:
        status:
          const: UP
        time: *id003
    ReadinessResult:
      type: object
      additionalProperties: false
      required:
      - transactionalReady
      - databaseReady
      - schemaCompatible
      - reasons
      properties:
        transactionalReady:
          type: boolean
        databaseReady:
          type: boolean
        schemaCompatible:
          type: boolean
        syncHealthy:
          type: boolean
        reasons:
          type: array
          items:
            type: string
    VersionResult:
      type: object
      additionalProperties: false
      required:
      - buildVersion
      - apiVersions
      - schemaVersion
      - syncVersions
      properties:
        buildVersion:
          type: string
        apiVersions:
          type: array
          items:
            type: string
        schemaVersion:
          type: string
        syncVersions:
          type: array
          items:
            type: string
    CompatibilityCheckRequest:
      type: object
      additionalProperties: false
      required:
      - clientVersion
      - apiVersion
      properties:
        clientVersion:
          type: string
        apiVersion:
          type: string
        clientCapabilities:
          type: array
          uniqueItems: true
          items:
            type: string
    CompatibilityResult:
      type: object
      additionalProperties: false
      required:
      - compatible
      - writeAllowed
      - supportedApiVersions
      properties:
        compatible:
          type: boolean
        writeAllowed:
          type: boolean
        requiredAction:
          anyOf:
          - type: string
          - type: 'null'
        supportedApiVersions:
          type: array
          items:
            type: string
    BusinessContextResult:
      type: object
      additionalProperties: false
      required:
      - context
      properties:
        context:
          $ref: '#/components/schemas/BusinessContextSnapshot'
    Capability:
      type: object
      additionalProperties: false
      required:
      - code
      - enabled
      properties:
        code:
          type: string
        enabled:
          type: boolean
        version:
          anyOf:
          - type: string
          - type: 'null'
        reason:
          anyOf:
          - type: string
          - type: 'null'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          writeOnly: true
    PinLoginRequest:
      type: object
      additionalProperties: false
      required:
      - userId
      - pin
      properties:
        userId:
          $ref: '#/components/schemas/Uuid'
        pin:
          type: string
          minLength: 1
          writeOnly: true
    ReauthenticateRequest:
      type: object
      additionalProperties: false
      required:
      - credential
      - purpose
      properties:
        credential:
          type: string
          minLength: 1
          writeOnly: true
        purpose:
          type: string
    SessionLockRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          anyOf:
          - type: string
          - type: 'null'
    SessionUnlockRequest:
      type: object
      additionalProperties: false
      required:
      - credential
      properties:
        credential:
          type: string
          minLength: 1
          writeOnly: true
    CredentialResetRequest:
      type: object
      additionalProperties: false
      required:
      - credentialType
      - newCredential
      - reasonCode
      properties:
        credentialType:
          type: string
          enum:
          - PASSWORD
          - PIN
        newCredential:
          type: string
          minLength: 1
          writeOnly: true
        reasonCode:
          type: string
        overrideId:
          anyOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
    SessionResult:
      type: object
      additionalProperties: false
      required:
      - counterId
      - issuedAt
      - sessionId
      - sessionToken
      - state
      - userId
      properties:
        sessionId:
          $ref: '#/components/schemas/Uuid'
        userId:
          $ref: '#/components/schemas/Uuid'
        counterId:
          $ref: '#/components/schemas/Uuid'
        state:
          type: string
          enum:
          - ACTIVE
          - LOCKED
          - ENDED
        issuedAt: *id003
        expiresAt:
          anyOf:
          - *id003
          - type: 'null'
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
        sessionToken:
          type: string
          minLength: 16
          readOnly: true
          description: Opaque Store Node session bearer; never logged.
    OverrideRequest:
      type: object
      additionalProperties: false
      required:
      - permissionCode
      - reasonCode
      properties:
        permissionCode:
          type: string
        reasonCode:
          type: string
        note:
          anyOf:
          - type: string
          - type: 'null'
        credential:
          type: string
          writeOnly: true
    OverrideAuthorization:
      type: object
      additionalProperties: false
      required:
      - overrideId
      - permissionCode
      - authorizedByUserId
      - expiresAt
      properties:
        overrideId:
          $ref: '#/components/schemas/Uuid'
        permissionCode:
          type: string
        authorizedByUserId:
          $ref: '#/components/schemas/Uuid'
        expiresAt: *id003
    SupportSessionRequest:
      type: object
      additionalProperties: false
      required:
      - reasonCode
      - requestedScopes
      properties:
        reasonCode:
          type: string
        requestedScopes:
          type: array
          uniqueItems: true
          items:
            type: string
        expiresInMinutes:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
    SupportSession:
      type: object
      additionalProperties: false
      required:
      - supportSessionId
      - scopes
      - state
      - expiresAt
      properties:
        supportSessionId:
          $ref: '#/components/schemas/Uuid'
        scopes:
          type: array
          items:
            type: string
        state:
          type: string
          enum:
          - ACTIVE
          - REVOKED
          - EXPIRED
        expiresAt: *id003
    Company:
      type: object
      additionalProperties: false
      required:
      - id
      - version
      - active
      - name
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        version:
          type: integer
          minimum: 0
        active:
          type: boolean
        name:
          type: string
          minLength: 1
        businessIdentity:
          anyOf:
          - $ref: '#/components/schemas/BusinessIdentity'
          - type: 'null'
        contact:
          anyOf:
          - $ref: '#/components/schemas/ContactInfo'
          - type: 'null'
        defaultLanguage:
          anyOf:
          - type: string
          - type: 'null'
        receiptIdentity:
          anyOf:
          - $ref: '#/components/schemas/ReceiptIdentity'
          - type: 'null'
    Store:
      type: object
      additionalProperties: false
      required:
      - id
      - version
      - active
      - name
      - timezone
      - currency
      - countryCode
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        version:
          type: integer
          minimum: 0
        active:
          type: boolean
        name:
          type: string
          minLength: 1
        timezone:
          type: string
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        countryCode:
          type: string
          pattern: ^[A-Z]{2}$
        defaultLanguage:
          anyOf:
          - type: string
          - type: 'null'
        receiptIdentity:
          anyOf:
          - $ref: '#/components/schemas/ReceiptIdentity'
          - type: 'null'
        contact:
          anyOf:
          - $ref: '#/components/schemas/ContactInfo'
          - type: 'null'
        storeNodeAssociation:
          anyOf:
          - $ref: '#/components/schemas/StoreServiceContext'
          - type: 'null'
          readOnly: true
          description: Derived from integration.store_service_instances; not editable
            Store master data.
    Counter:
      type: object
      additionalProperties: false
      required:
      - id
      - version
      - active
      - storeId
      - name
      - enrollmentState
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        version:
