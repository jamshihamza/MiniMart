    ArtifactDescriptor:
      type: object
      additionalProperties: false
      required:
      - artifactId
      - fileName
      - mediaType
      - sizeBytes
      - sha256
      - expiresAt
      - state
      properties:
        artifactId:
          $ref: '#/components/schemas/Uuid'
        fileName:
          type: string
        mediaType:
          type: string
        sizeBytes:
          type: integer
          minimum: 0
        sha256:
          type: string
          pattern: ^[A-Fa-f0-9]{64}$
        expiresAt:
          type: string
          format: date-time
        state:
          type: string
          enum:
          - READY
          - CONSUMED
          - EXPIRED
    ArtifactUpload:
      type: object
      additionalProperties: false
      required:
      - file
      - sha256
      properties:
        file:
          type: string
          format: binary
        sha256:
          type: string
          pattern: ^[A-Fa-f0-9]{64}$
        fileName:
          anyOf:
          - type: string
          - type: 'null'
        mediaType:
          anyOf:
          - type: string
          - type: 'null'
      description: Bytes are staged privately. No artifactId is visible until size
        and SHA-256 validation pass. Partial bytes are automatically removed on abort,
        timeout or disconnect.
    BinaryArtifact:
      type: string
      format: binary
    CountryDraftSnapshot:
      type: object
      additionalProperties: false
      required:
      - documentType
      - draftId
      - payloadCanonicalJson
      properties:
        documentType:
          type: string
        draftId:
          type: string
        payloadCanonicalJson:
          type: string
          minLength: 2
        payloadHash:
          anyOf:
          - type: string
          - type: 'null'
    IdempotencyPolicy:
      type: object
      additionalProperties: false
      required:
      - retentionSeconds
      - expiresAtHeader
      - expiredKeyBehavior
      properties:
        retentionSeconds:
          type: integer
          minimum: 1
        expiresAtHeader:
          const: Idempotency-Expires-At
        expiredKeyBehavior:
          const: MAY_BE_ACCEPTED_AS_NEW_AFTER_DOMAIN_DUPLICATE_GUARDS
    ArtifactPolicy:
      type: object
      additionalProperties: false
      required:
      - maxImportArtifactBytes
      - uploadVisibility
      - partialUploadCleanup
      properties:
        maxImportArtifactBytes:
          type: integer
          minimum: 1
        uploadVisibility:
          type: string
          const: ATOMIC_AFTER_CHECKSUM_VERIFIED
        partialUploadCleanup:
          type: string
          const: AUTOMATIC_ON_ABORT_TIMEOUT_OR_DISCONNECT
    SystemCapabilities:
      type: object
      additionalProperties: false
      required:
      - capabilities
      - idempotencyPolicy
      - artifactPolicy
      properties:
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
        idempotencyPolicy:
          $ref: '#/components/schemas/IdempotencyPolicy'
        artifactPolicy:
          $ref: '#/components/schemas/ArtifactPolicy'
