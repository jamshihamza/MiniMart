info:
  title: MiniMart Store Node API
  version: 1.0.0
  description: 'MiniMart Store Node API v0.2 Freeze Candidate. OpenAPI is the canonical
    machine-readable API source; implementation generates Zod validators/types and
    CI check-diffs generated artifacts.


    MiniMart API Contracts v1.0 FROZEN.'
servers:
- url: https://{storeNodeHost}
  description: Deployment-supplied Store Node endpoint; hostname/discovery convention
    is non-normative.
  variables:
    storeNodeHost:
      default: store-node-host
