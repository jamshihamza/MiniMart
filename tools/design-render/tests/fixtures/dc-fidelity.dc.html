<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <div>
        <sc-if value="{{ flag }}"><span data-test="if-true">shown</span></sc-if>
        <sc-if value="{{ !flag }}"><span data-test="if-false">also-shown</span></sc-if>
        <sc-for list="{{ items }}" as="it"><span class="row">{{ it }}</span></sc-for>
        <div style="width: 60px; height: 60px">
          <image-slot id="slot-1" shape="rect" placeholder="Drop packshot"></image-slot>
        </div>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script>
      class Component extends DCLogic {
        renderVals(){
          const screen = this.props.screen;
          return { flag: screen === '01', items: screen === '02' ? ['a','b','c'] : ['x'] };
        }
      }
    </script>
  </body>
</html>
