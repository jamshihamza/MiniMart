name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typescript-foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MINIMART_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Static, boundary, and frozen-authority gates
        run: pnpm run ci
      - name: PostgreSQL migration and schema integration tests
        run: pnpm run test:database
      - name: Service runtime and system-contract tests
        run: pnpm run test:service-runtime
      - name: POS shell and connectivity tests
        run: pnpm run test:pos-shell
      - name: POS frontend production build
        run: pnpm --filter @minimart/pos-terminal build

  rust-foundation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - name: Root hardware-port formatting
        run: cargo fmt --all --check
      - name: Root hardware-port locked check
        run: cargo check --workspace --locked
      - name: Root hardware-port Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: POS Tauri formatting
        run: cargo fmt --manifest-path apps/pos-terminal/src-tauri/Cargo.toml --check
      - name: POS Tauri locked check
        run: cargo check --manifest-path apps/pos-terminal/src-tauri/Cargo.toml --locked
      - name: POS Tauri Clippy
        run: cargo clippy --manifest-path apps/pos-terminal/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
