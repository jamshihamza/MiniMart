[package]
name = "minimart-pos-terminal"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "minimart_pos_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Security_Cryptography"] }

# The native shell is self-contained; the frozen root workspace continues
# to own only the four hardware-port crates.
[workspace]
